<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>我的小镇 · 界面设计预览</title>
    <link rel="stylesheet" href="./styles.css" />
    <script src="./preview.js" defer></script>
  </head>
  <body>
    <svg class="symbol-library" aria-hidden="true" xmlns="http://www.w3.org/2000/svg">
      <symbol id="i-grain" viewBox="0 0 24 24">
        <path
          d="M7 22 18 3M11 16C6 17 4 14 5 11c4 0 7 1 6 5Zm3-5C10 11 9 8 11 5c4 1 5 3 3 6Zm1 0c0 4 3 5 6 3-1-4-3-5-6-3Zm3-5c-2-3-1-5 2-6 2 3 1 5-2 6Z"
        />
      </symbol>
      <symbol id="i-wood" viewBox="0 0 24 24">
        <path d="m8 5 12 8M5 9l12 8M4 8l5-5 13 9-6 8L3 11Z" />
        <ellipse cx="6" cy="9" rx="3" ry="4" transform="rotate(-25 6 9)" />
        <path d="m14 8-5 7m9-4-5 7" />
      </symbol>
      <symbol id="i-stone" viewBox="0 0 24 24">
        <path d="m3 15 3-9 10-3 6 8-2 9-12 1Z" />
        <path d="m6 6 5 8 11-3M11 14l-3 7m3-7 5-11" />
      </symbol>
      <symbol id="i-board" viewBox="0 0 24 24">
        <path d="m3 8 13-5 6 12-14 6Z" />
        <path d="m8 6 5 13M3 8l5 13m2-13 6-2M12 15l6-2" />
      </symbol>
      <symbol id="i-water" viewBox="0 0 24 24">
        <path d="M12 2C9 7 5 11 5 15a7 7 0 0 0 14 0c0-4-4-8-7-13Z" />
        <path d="M8 15c0 2 1 3 3 4" />
      </symbol>
      <symbol id="i-bread" viewBox="0 0 24 24">
        <path d="M3 12c0-7 18-7 18 0v7H3Z" />
        <path d="m8 10-1 4m6-5-1 5m6-4-1 4M3 16h18" />
      </symbol>
      <symbol id="i-home" viewBox="0 0 24 24">
        <path d="m3 11 9-8 9 8M5 10v11h14V10M10 21v-7h4v7M7 7V3h3" />
      </symbol>
      <symbol id="i-hammer" viewBox="0 0 24 24">
        <path d="m5 21 9-11 3 3-9 10Zm6-17 3-3 8 7-4 5-6-6-5 1-2-2 4-3Z" />
      </symbol>
      <symbol id="i-book" viewBox="0 0 24 24">
        <path
          d="M12 5C8 2 4 3 2 4v16c4-1 7-1 10 1 3-2 6-2 10-1V4c-3-1-6-2-10 1Zm0 0v16M5 8l4 1m-4 3 4 1m6-4 4-1m-4 5 4-1"
        />
      </symbol>
      <symbol id="i-people" viewBox="0 0 24 24">
        <circle cx="12" cy="7" r="4" />
        <path d="M4 22v-3a8 8 0 0 1 16 0v3M3 6a3 3 0 0 0 0 6m18-6a3 3 0 0 1 0 6" />
      </symbol>
      <symbol id="i-settings" viewBox="0 0 24 24">
        <path
          d="m9 3 1-2h4l1 3 3 1 3-1 2 4-2 2v4l2 2-2 4-3-1-3 1-1 3h-4l-1-3-3-1-3 1-2-4 2-2v-4L1 8l2-4 3 1Z"
        />
        <circle cx="12" cy="12" r="4" />
      </symbol>
      <symbol id="i-spark" viewBox="0 0 24 24">
        <path d="m12 1 3 8 8 3-8 3-3 8-3-8-8-3 8-3Zm8 0 1 3 3 1-3 1-1 3-1-3-3-1 3-1Z" />
      </symbol>
      <symbol id="i-close" viewBox="0 0 24 24"><path d="m6 6 12 12M6 18 18 6" /></symbol>
      <symbol id="i-arrow" viewBox="0 0 24 24"><path d="M4 12h16m-6-6 6 6-6 6" /></symbol>
      <symbol id="i-expand" viewBox="0 0 24 24">
        <path d="M3 9V3h6m6 0h6v6M3 15v6h6m6 0h6v-6M8 8l-5-5m13 5 5-5M8 16l-5 5m13-5 5 5" />
      </symbol>
      <symbol id="i-check" viewBox="0 0 24 24"><path d="m5 12 5 5L21 5" /></symbol>
      <symbol id="i-store" viewBox="0 0 24 24">
        <path d="m2 9 10-6 10 6v12H2Zm3 3h14M8 21v-6h8v6M12 3v6" />
      </symbol>
    </svg>
    <main class="game-shell" aria-label="小镇界面视觉原型">
      <div class="world" role="region" aria-label="手绘森林院落，场景概念图">
        <div class="world-wash"></div>
        <div class="world-art">
          <button
            class="place-marker selected"
            data-place="farm"
            style="--x: 64%; --y: 60%"
            aria-label="选择农田"
          >
            <span class="marker-dot"></span><span>农田</span>
          </button>
          <button
            class="place-marker"
            data-place="workshop"
            style="--x: 21%; --y: 45%"
            aria-label="选择木工坊"
          >
            <span class="marker-dot"></span><span>木工坊</span>
          </button>
          <button
            class="place-marker"
            data-place="well"
            style="--x: 48%; --y: 43%"
            aria-label="选择水井"
          >
            <span class="marker-dot"></span><span>水井</span>
          </button>
        </div>
      </div>

      <header class="hud">
        <div class="town-brand">
          <span class="town-crest"
            ><svg class="icon"><use href="#i-home" /></svg
          ></span>
          <div>
            <h1>我的小镇</h1>
            <p>工坊时代 <span>·</span> 小镇总览</p>
          </div>
        </div>
        <button
          class="round-button resource-toggle"
          data-dialog="resources"
          aria-label="打开资源总览"
        >
          <svg class="icon"><use href="#i-store" /></svg>
        </button>
        <div class="resource-bar paper" aria-label="资源库存，数值待接入">
          <button class="resource" data-dialog="resources">
            <svg class="icon grain"><use href="#i-grain" /></svg
            ><span><small>原粮</small><b>--</b></span>
          </button>
          <button class="resource" data-dialog="resources">
            <svg class="icon wood"><use href="#i-wood" /></svg
            ><span><small>木材</small><b>--</b></span>
          </button>
          <button class="resource" data-dialog="resources">
            <svg class="icon stone"><use href="#i-stone" /></svg
            ><span><small>石材</small><b>--</b></span>
          </button>
          <button class="resource" data-dialog="resources">
            <svg class="icon board"><use href="#i-board" /></svg
            ><span><small>板材</small><b>--</b></span>
          </button>
          <button class="resource" data-dialog="resources">
            <svg class="icon water"><use href="#i-water" /></svg
            ><span><small>饮水</small><b>--</b></span>
          </button>
          <button class="resource" data-dialog="resources">
            <svg class="icon bread"><use href="#i-bread" /></svg
            ><span><small>口粮</small><b>--</b></span>
          </button>
        </div>
        <button class="round-button" data-dialog="settings" aria-label="打开设置">
          <svg class="icon"><use href="#i-settings" /></svg>
        </button>
      </header>

      <button class="inspiration-invite paper" data-dialog="inspiration">
        <span class="invite-icon"
          ><svg class="icon"><use href="#i-spark" /></svg></span
        ><span><small>发展机遇</small><strong>为小镇添一份新灵感</strong></span
        ><svg class="icon arrow-icon"><use href="#i-arrow" /></svg>
      </button>

      <aside class="object-card paper" aria-label="当前建筑操作">
        <div class="object-art">
          <span class="object-seal"
            ><svg class="icon"><use href="#i-grain" /></svg></span
          ><button class="card-close round-button" aria-label="收起建筑详情">
            <svg class="icon"><use href="#i-close" /></svg>
          </button>
        </div>
        <div class="object-main">
          <div class="object-title">
            <div>
              <p class="eyebrow">生产设施</p>
              <h2>
                <button class="object-picker" data-dialog="objects" aria-label="更换选中建筑">
                  <span id="object-name">农田</span><span aria-hidden="true">⌄</span>
                </button>
              </h2>
            </div>
            <span class="rank-badge">Ⅰ <span>星</span></span>
          </div>
          <div class="object-yield">
            <span><i class="status-dot"></i><span id="output-label">原粮产出</span></span
            ><strong>-- <small>/ 秒</small></strong>
          </div>
          <section class="upgrade-preview">
            <div class="section-heading">
              <h3>下一次升级</h3>
              <span class="tiny-tag">成长预览</span>
            </div>
            <div class="upgrade-line">
              <span id="upgrade-label">自动产出</span
              ><b
                >-- <svg class="icon"><use href="#i-arrow" /></svg> --</b
              >
            </div>
            <div class="cost-row">
              <span>所需材料</span
              ><span class="cost"
                ><svg class="icon wood"><use href="#i-wood" /></svg>--<svg class="icon stone">
                  <use href="#i-stone" /></svg
                >--</span
              >
            </div>
          </section>
          <div class="object-actions">
            <button class="main-button" data-action="upgrade">
              <svg class="icon"><use href="#i-hammer" /></svg>升级<span
                class="button-plus"
                aria-hidden="true"
                >＋</span
              ></button
            ><button class="detail-button" aria-expanded="false">详情</button>
          </div>
          <div class="object-details" hidden>
            <span>设施等级 <b>--</b></span
            ><span>当前效率 <b>--</b></span
            ><span>升级进度 <b>--</b></span>
          </div>
        </div>
      </aside>

      <section class="town-note paper">
        <div class="note-cap">
          <svg class="icon"><use href="#i-hammer" /></svg><span>建设目标</span>
        </div>
        <h2>整修院落</h2>
        <button data-dialog="courtyard">
          查看条件 <svg class="icon"><use href="#i-arrow" /></svg>
        </button>
      </section>
      <div class="camera-controls">
        <button class="round-button" aria-label="查看全景" data-action="fit">
          <svg class="icon"><use href="#i-expand" /></svg></button
        ><button class="round-button" aria-label="放大场景" data-action="zoom">＋</button>
      </div>

      <nav class="navigation paper" aria-label="游戏功能" role="tablist">
        <button class="nav-item active" role="tab" aria-selected="true" data-tab="camp">
          <svg class="icon"><use href="#i-home" /></svg><span>小镇</span></button
        ><button class="nav-item" role="tab" aria-selected="false" tabindex="-1" data-tab="skills">
          <svg class="icon"><use href="#i-hammer" /></svg><span>技能</span></button
        ><button
          class="nav-item"
          role="tab"
          aria-selected="false"
          tabindex="-1"
          data-tab="research"
        >
          <svg class="icon"><use href="#i-book" /></svg><span>研究</span></button
        ><button
          class="nav-item"
          role="tab"
          aria-selected="false"
          tabindex="-1"
          data-tab="population"
        >
          <svg class="icon"><use href="#i-people" /></svg><span>民生</span></button
        ><button
          class="nav-item"
          role="tab"
          aria-selected="false"
          tabindex="-1"
          data-tab="settings"
        >
          <svg class="icon"><use href="#i-settings" /></svg><span>设置</span>
        </button>
      </nav>
      <p class="preview-label">界面设计预览 <span>·</span> 数值待接入</p>
      <div class="toast" role="status" aria-live="polite" hidden></div>
    </main>
    <dialog id="review-dialog" class="review-dialog paper">
      <button class="dialog-close round-button" aria-label="关闭窗口">
        <svg class="icon"><use href="#i-close" /></svg>
      </button>
      <div id="dialog-content"></div>
    </dialog>
  </body>
</html>
